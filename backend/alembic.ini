# Alembic. The URL is not here on purpose: it is read from .env in
# migrations/env.py so there is exactly one place credentials live.
#
# Migrations run as the OWNER role, not the restricted application role. The
# application is not supposed to be able to change its own schema, and that is
# only true if it never has the privilege to.

[alembic]
script_location = migrations
prepend_sys_path = .
version_path_separator = os
timezone = UTC

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
